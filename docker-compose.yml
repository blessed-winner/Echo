services:

  db:
    image: postgres:17-alpine
    container_name: echo-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: echo
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC

    ports:
      - "5433:5432"

    volumes:
      - echo_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d echo"]
      interval: 5s
      timeout: 5s
      retries: 10


  echo:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: echo-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8080:8080"


  prometheus:
    image: prom/prometheus
    container_name: echo-prometheus
    restart: unless-stopped

    depends_on:
      - echo

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - echo_prometheus_data:/prometheus

    ports:
      - "9090:9090"


  grafana:
    image: grafana/grafana
    container_name: echo-grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - echo_grafana_data:/var/lib/grafana


volumes:
  echo_postgres_data:
  echo_prometheus_data:
  echo_grafana_data: